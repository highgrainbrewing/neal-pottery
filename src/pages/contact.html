<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact | Neal Pottery</title>
  <meta name="description" content="Get in touch with Greg and Amy Neal about an order, a custom piece or an upcoming show.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
{{> header}}
<main id="main">
  <section class="page-head">
    <p class="kicker">Get in touch</p>
    <h1 class="display display--dark">Contact Us</h1>
    <p class="muted">Questions about a piece, an order or a show? Send us a note and Amy will get back to you. For an existing Etsy order, messaging us through Etsy is fastest.</p>
  </section>
  <section class="section section--flush-top">
    <form class="contact" name="contact" method="POST" action="thanks.html" data-netlify="true" netlify-honeypot="company">
      <input type="hidden" name="form-name" value="contact">
      <p hidden><label>Company <input name="company"></label></p>
      <label>Name <input name="name" autocomplete="name"></label>
      <label>Email <input name="email" type="email" autocomplete="email" required></label>
      <label>Message <textarea name="message" rows="6" required></textarea></label>
      <button class="btn" type="submit">Send message</button>
    </form>
  </section>
</main>
{{> footer}}
</body>
</html>
